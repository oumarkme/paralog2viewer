# GitHub Pages site. The CI workflow (.github/workflows/pages.yml) copies
# README.md to index.md before the Jekyll build, so README.md is the only
# source of the page text.
title: paralog2viewer
description: >-
  Per-haplotype variant calls, annotation and read-pileup figures for
  paralogous genes from ONT Paraphase results. Research use only.
theme: minima
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true
author:
  name: Jen-Hsiang Ou, Ph.D.
header_pages: []
exclude:
  - mermaid.html
