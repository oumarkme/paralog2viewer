name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Pushes to other branches are covered by the pull_request trigger.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/oumarkme/paralog2viewer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: paralog2viewer:test
          cache-from: type=gha,scope=paralog2viewer
          cache-to: type=gha,scope=paralog2viewer,mode=max
      - name: ruff check
        run: docker run --rm paralog2viewer:test ruff check
      - name: ruff format --check
        run: docker run --rm paralog2viewer:test ruff format --check
      - name: pytest
        run: docker run --rm paralog2viewer:test pytest -q tests

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag against VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != v${version} (VERSION)" >&2
            exit 1
          fi
      - name: Compute tags
        id: meta
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=paralog2viewer
          cache-to: type=gha,scope=paralog2viewer,mode=max
      - name: Digest in job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Pull: \`${IMAGE}@${DIGEST}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
