[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paralog2viewer"
dynamic = ["version"]
description = "Per-haplotype variant calling, annotation and read-pileup figures from ONT Paraphase results"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["pysam", "numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
paralog2viewer = "paralog2viewer.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paralog2viewer = ["resources/*.tsv"]

[tool.ruff]
line-length = 80
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
